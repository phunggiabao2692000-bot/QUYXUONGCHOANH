<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nhà kinh dị - xem bản đồ</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:'Segoe UI',Arial,sans-serif;color:#eee}
#info{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.82);border:1px solid #666;padding:8px 12px;font-size:13px;line-height:1.7;max-width:350px;z-index:5}
kbd{background:#222;border:1px solid #777;border-radius:3px;padding:0 5px;font-size:12px}
#st{color:#9f9}#mode,#fl{color:#fff;font-weight:700}
#err{display:none;position:fixed;left:0;right:0;top:0;z-index:99;background:#b00;color:#fff;padding:10px 14px;font-size:15px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="err"></div>
<div id="info">
  <div><b>Nhà 72x52m: cầu thang lớn, tay vịn nâu, tủ ở mọi phòng</b></div>
  <div id="st">Đang chờ...</div>
  <div>Chế độ: <span id="mode"></span> (<kbd>V</kbd> đổi) &nbsp; Xem: <span id="fl"></span></div>
  <div><kbd>1</kbd> tầng trệt &nbsp; <kbd>2</kbd> tầng lầu &nbsp; <kbd>3</kbd> cả hai &nbsp; <kbd>L</kbd> tên phòng &nbsp; <kbd>C</kbd> trần nhà &nbsp; <kbd>F</kbd> sáng/tối &nbsp; <kbd>K</kbd> độ phân giải</div>
  <div id="help"></div>
</div>
<script>
var $ = function (i) { return document.getElementById(i); };
function st(t) { $('st').textContent = t; }
function showErr(m) { var b = $('err'); b.textContent = m; b.style.display = 'block'; }
addEventListener('error', function (e) { showErr('Lỗi: ' + e.message + ' (dòng ' + e.lineno + ')'); });
st('1. Trang đã chạy, đang kiểm tra thư viện 3D...');
function start() {
  st('2. Có thư viện 3D, đang dựng nhà...');
  try { build(); st('3. Dựng xong, không có lỗi'); } catch (e) { showErr('Lỗi khi dựng: ' + e.message); }
}
if (window.THREE) start();
else {
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
  s.onload = start; s.onerror = function () { showErr('Không tải được Three.js. Hãy kiểm tra mạng.'); };
  document.head.appendChild(s);
}

function build() {
// ================= BẢN ĐỒ (mét). x sang phải, z xuống. Cửa chính ở z = D =================
const W = 72, D = 52, CX = W / 2, F2 = 9.6;
const WT = 0.3, WHG = F2 - 0.2, WHU = 4, DH = 3, NZ = 12, GZ = 7, SW = 14;   // NZ: độ sâu phòng phía bắc tầng lầu | GZ: hành lang 1 | SW: bề rộng khối phòng 2 bên
// CẦU THANG: MW = bề rộng thang giữa | LD = độ sâu chiếu nghỉ | LXH = nửa bề rộng chiếu nghỉ (tăng các số này để cầu thang to hơn)
const STEPS = 24, RISE = (F2 / 2) / STEPS, RUN = 0.3, RH = 1, LD = 6, MW = 12, LXH = 10, AR = 6, AW = 5;
const TOT = STEPS * RUN + LD / 2 + AR;
const FZ0 = D / 2 + TOT / 2, HZ = D / 2 - TOT / 2;
const LZ = FZ0 - STEPS * RUN - LD / 2, LH = F2 / 2;
const HH = LXH + AR + AW / 2, IN = LXH + AR - AW / 2;
const T1 = HZ + 8, T2 = HZ + 16, KS = HZ + 17;       // ranh giới: tắm 1 | tắm 2 | game ; trẻ em | bí mật
const GY = 0.04, UY = F2 + 0.04, UC = F2 + WHU;
const EG = 5, EU = 5;                       // mét mở rộng thêm: EG = hành lang 1 (tầng trệt), EU = hành lang 2 (tầng lầu)
const CZ1 = (GZ - EG) / 2, CZ2 = (NZ - EU + HZ) / 2;   // tâm hành lang 1 và 2
// [tên, x1, z1, x2, z2, màu sàn, lát caro?]
const RG = [
 ['HÀNH LANG 1', 0, -EG, W, GZ, 0x4a4a4a, 0], ['PHÒNG KHÁCH', 0, GZ, SW, D, 0x2a2a2a, 0],
  ['SẢNH', SW, GZ, W - SW, D, 0x777777, 1], ['PHÒNG KHO', W - SW, GZ, W, D, 0x202020, 0]
];
const RU = [
 ['PHÒNG NGỦ', 0, -EU, 26, NZ - EU, 0x2a2a2a, 0], ['PHÒNG BẾP', 26, -EU, 50, NZ - EU, 0x777777, 1],
['THƯ VIỆN', 50, -EU, W, NZ - EU, 0x202020, 0], ['HÀNH LANG 2', 0, NZ - EU, W, HZ, 0x3a3a3a, 0],
  ['PHÒNG TẮM 1', 0, HZ, SW, T1, 0x777777, 1], ['PHÒNG TẮM 2', 0, T1, SW, T2, 0x777777, 1],
  ['PHÒNG GAME', 0, T2, SW, D, 0x1c1c1c, 0],
  ['BAN CÔNG TÂY', SW, HZ, CX - HH, D, 0x333333, 0], ['BAN CÔNG ĐÔNG', CX + HH, HZ, W - SW, D, 0x333333, 0],
  ['PHÒNG TRẺ EM', W - SW, HZ, W, KS, 0x2a2a2a, 0], ['PHÒNG BÍ MẬT', W - SW, KS, W, D, 0x111111, 0]
];
// Tường: [hướng, từ, đến, vị trí cố định, [cửa [bắt đầu, kết thúc]]]  ('x' chạy ngang, 'z' chạy dọc; cửa xếp từ nhỏ đến lớn)
const WG = [
 ['x', 0, W, -EG, []], ['x', 0, W, D, [[CX - 2, CX + 2]]], ['z', -EG, D, 0, []], ['z', -EG, D, W, []],
  ['x', 0, W, GZ, [[5, 8], [CX - 8, CX + 8], [W - 8, W - 5]]],
  ['z', GZ, D, SW, [[26, 29]]], ['z', GZ, D, W - SW, [[26, 29]]]
];
const WU = [
  ['x', 0, W, 0, []], ['x', 0, W, D, []], ['z', 0, D, 0, []], ['z', 0, D, W, []],
  ['x', 0, W, NZ, [[11, 14], [28, 31], [58, 61]]], ['z', 0, NZ, 26, []], ['z', 0, NZ, 50, []],
  ['x', 0, SW, HZ, [[9, 12]]], ['x', 0, SW, T1, []], ['x', 0, SW, T2, []],
  ['z', HZ, D, SW, [[HZ + 2.5, HZ + 5.5], [T1 + 2.5, T1 + 5.5], [T2 + 4, T2 + 7]]],
  ['x', W - SW, W, HZ, [[W - 12, W - 9]]],
  ['x', W - SW, W, KS, [[W - 8, W - 5]]],            // lối vào phòng bí mật (che sau kệ sách)
  ['z', HZ, D, W - SW, [[HZ + 4, HZ + 7]]]
];
const KEY = [W - 8, 30], EXIT = [CX, D];
const BAT = [[7, 12, 0], [CX, 3.5, 0], [W - 7, 46, 0], [60, 4, F2]];   // [x, z, độ cao sàn]
// ==========================================================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030303);
scene.fog = new THREE.FogExp2(0x040404, 0.006);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 800);
const renderer = new THREE.WebGLRenderer({ antialias: true });
const RATIOS = [1, 1.5, 2]; let ri = 0;
function setRes() { renderer.setPixelRatio(RATIOS[ri]); renderer.setSize(innerWidth, innerHeight); }
setRes();
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
addEventListener('resize', function () { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); setRes(); });

const amb = new THREE.AmbientLight(0xffffff, 0.26); scene.add(amb);
const hemi = new THREE.HemisphereLight(0x8890a0, 0x1a1010, 0.25); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xaab4ff, 0.45); sun.position.set(30, 110, 40);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
const sc = sun.shadow.camera; sc.left = -60; sc.right = 60; sc.top = 60; sc.bottom = -60; sc.near = 1; sc.far = 300;
scene.add(sun);

const G = new THREE.Group(), U = new THREE.Group(), B = new THREE.Group(), CE = new THREE.Group();
scene.add(G); scene.add(U); scene.add(B); U.add(CE); CE.visible = false;
const AN = renderer.capabilities.getMaxAnisotropy();
const LT = [];   // danh sách đèn: {l: đèn, base: độ sáng, flick: có chập chờn không}

function tex(base, r1, r2, tile) {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'); g.fillStyle = base || '#222'; g.fillRect(0, 0, S, S);
  if (tile) {
    g.fillStyle = '#c4c4c4'; g.fillRect(0, 0, S, S);
    g.fillStyle = '#0d0d0d'; g.fillRect(0, 0, S / 2, S / 2); g.fillRect(S / 2, S / 2, S / 2, S / 2);
    g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 2;
    g.strokeRect(0, 0, S / 2, S / 2); g.strokeRect(S / 2, 0, S / 2, S / 2); g.strokeRect(0, S / 2, S / 2, S / 2); g.strokeRect(S / 2, S / 2, S / 2, S / 2);
  }
  for (let i = 0; i < 700; i++) { const v = Math.random() < 0.7 ? 0 : 255; g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + Math.random() * 0.12 + ')'; g.fillRect(Math.random() * S, Math.random() * S, Math.random() * 20 + 1, Math.random() * 20 + 1); }
  for (let i = 0; i < 4; i++) { const x = Math.random() * S, y = Math.random() * S, r = 30 + Math.random() * 60, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(0,0,0,.4)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(r1, r2);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = AN; return t;
}
const SM = function (map, rough, bump) { return new THREE.MeshStandardMaterial({ map: map, bumpMap: map, bumpScale: bump, roughness: rough, metalness: 0.05 }); };
const M = function (c, r, e) { return new THREE.MeshStandardMaterial({ color: c, roughness: r === undefined ? 0.8 : r, emissive: e || 0 }); };
const WALL = SM(tex('#6b6966', 1, 1, false), 0.95, 1.2);
// TAY VỊN NÂU QUÝ TỘC: thân gỗ óc chó đậm, thanh trên nâu bóng, quả cầu đồng
const RAIL = M(0x2e1a0f, 0.5), CAP = M(0x6b3f24, 0.28), GOLD = new THREE.MeshStandardMaterial({ color: 0x9a7b3c, roughness: 0.3, metalness: 0.7 });
const STW = M(0xcfcfcf, 0.6), STB = M(0x101010, 0.5), SL = M(0x181818, 1), IRON = M(0x161616, 0.45);
const MT = {
  wood: M(0x2b2622, 0.7), wood2: M(0x4a443e, 0.7), wh: M(0xd8d8d8, 0.7), bk: M(0x0e0e0e, 0.6), gy: M(0x6a6a6a, 0.7),
  fab: M(0x3c3c3e, 1), red: M(0x4a0b0b, 0.9), met: M(0x8a8a8a, 0.4), lamp: M(0xffe0b0, 0.5, 0x553311), flame: M(0xffcc66, 0.5, 0xffaa33),
  scr: M(0xdcecff, 0.3, 0x7fb0e8), neon: new THREE.MeshBasicMaterial({ color: 0xffffff }),
  cry: new THREE.MeshStandardMaterial({ color: 0xeef4ff, transparent: true, opacity: 0.75, roughness: 0.05, metalness: 0.3, emissive: 0x223344 }),
  gl: new THREE.MeshStandardMaterial({ color: 0x99aabb, transparent: true, opacity: 0.35, roughness: 0.1 })
};

function box(p, x, y, z, w, h, d, m) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; p.add(o); return o; }
function mk(w, h, d, m, x, y, z) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); return o; }
// Nội thất: mỗi món là danh sách khối [x, y đáy, z, rộng, cao, sâu, vật liệu, 'c' nếu hình trụ]; mặt trước quay về +z
function make(p, x, y0, z, ry, parts) {
  const g = new THREE.Group(); g.position.set(x, y0, z); g.rotation.y = ry || 0;
  parts.forEach(function (q) {
    const geo = q[7] === 'c' ? new THREE.CylinderGeometry(q[3] / 2, q[3] / 2, q[4], 14) : new THREE.BoxGeometry(q[3], q[4], q[5]);
    const o = new THREE.Mesh(geo, typeof q[6] === 'string' ? MT[q[6]] : q[6]);
    o.position.set(q[0], q[1] + q[4] / 2, q[2]); o.castShadow = q[4] > 0.5; o.receiveShadow = true; g.add(o);
  });
  p.add(g); return g;
}
function put(p, y0, x, z, ry, parts, rx, sc) { const g = make(p, x, y0, z, ry, parts); if (rx) g.rotation.x = rx; if (sc) g.scale.setScalar(sc); return g; }

// Texture gáy sách đen trắng
const BT = (function () {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); g.fillStyle = '#070707'; g.fillRect(0, 0, 128, 128);
  let x = 2;
  while (x < 124) {
    const w = 6 + Math.random() * 9 | 0, h = 68 + Math.random() * 44 | 0, v = 25 + Math.random() * 200 | 0;
    g.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')'; g.fillRect(x, 128 - h, w, h);
    g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(x + w - 1, 128 - h, 1, h); x += w + 1;
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; return t;
})();
function bookMat(w, h) { const t = BT.clone(); t.needsUpdate = true; t.repeat.set(w / 1.7, h / 1.2); return new THREE.MeshStandardMaterial({ map: t, roughness: 0.9 }); }

// ===== TRANH LỚN đen trắng vẽ bằng code (6 kiểu) =====
const ART = {};
function art(k) {
  if (ART[k]) return ART[k];
  const c = document.createElement('canvas'); c.width = 256; c.height = 192;
  const g = c.getContext('2d'), R = Math.random;
  const bg = g.createLinearGradient(0, 0, 0, 192); bg.addColorStop(0, '#2c2c2c'); bg.addColorStop(1, '#bdbdbd');
  g.fillStyle = bg; g.fillRect(0, 0, 256, 192); g.lineCap = 'round';
  if (k === 0) {          // trăng và cây khô
    g.fillStyle = '#f2f2f2'; g.beginPath(); g.arc(178, 62, 36, 0, 7); g.fill();
    g.strokeStyle = '#050505';
    (function br(x, y, len, a, d) {
      if (d > 6) return;
      const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
      g.lineWidth = 8 - d; g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
      br(x2, y2, len * 0.75, a - 0.45 + R() * 0.2, d + 1); br(x2, y2, len * 0.72, a + 0.4 + R() * 0.2, d + 1);
    })(70, 192, 42, -Math.PI / 2, 0);
  } else if (k === 1) {   // con mắt
    g.fillStyle = '#d8d8d8'; g.fillRect(0, 0, 256, 192);
    g.beginPath(); g.moveTo(24, 96); g.quadraticCurveTo(128, 6, 232, 96); g.quadraticCurveTo(128, 186, 24, 96);
    g.fillStyle = '#fafafa'; g.fill(); g.strokeStyle = '#000'; g.lineWidth = 6; g.stroke();
    g.fillStyle = '#3a3a3a'; g.beginPath(); g.arc(128, 96, 36, 0, 7); g.fill();
    g.fillStyle = '#000'; g.beginPath(); g.arc(128, 96, 15, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(118, 86, 6, 0, 7); g.fill();
    g.lineWidth = 3; for (let i = 0; i < 9; i++) { const x = 40 + i * 22; g.beginPath(); g.moveTo(x, 70 - Math.sin(i / 8 * Math.PI) * 30); g.lineTo(x - 6, 52 - Math.sin(i / 8 * Math.PI) * 34); g.stroke(); }
  } else if (k === 2) {   // ngôi nhà ma
    g.fillStyle = '#eee'; g.beginPath(); g.arc(210, 40, 20, 0, 7); g.fill();
    g.fillStyle = '#050505'; g.fillRect(70, 100, 110, 80); g.beginPath(); g.moveTo(60, 100); g.lineTo(125, 44); g.lineTo(190, 100); g.fill();
    g.fillRect(150, 52, 14, 30); g.fillRect(0, 175, 256, 17);
    g.fillStyle = '#f0f0f0'; g.fillRect(105, 118, 22, 28); g.fillRect(143, 118, 22, 28); g.fillStyle = '#000'; g.fillRect(115, 118, 2, 28); g.fillRect(105, 131, 22, 2);
    g.fillStyle = '#222'; g.fillRect(116, 150, 18, 30);
  } else if (k === 3) {   // chân dung không mặt
    g.fillStyle = '#9a9a9a'; g.fillRect(0, 0, 256, 192);
    g.fillStyle = '#0d0d0d'; g.beginPath(); g.arc(128, 215, 92, Math.PI, 0); g.fill();
    g.fillStyle = '#e4e4e4'; g.beginPath(); g.ellipse(128, 86, 36, 48, 0, 0, 7); g.fill();
    g.fillStyle = '#0a0a0a'; g.beginPath(); g.ellipse(128, 70, 40, 44, 0, Math.PI, 0); g.fill(); g.fillRect(88, 66, 80, 8);
  } else if (k === 4) {   // vòng xoắn
    g.fillStyle = '#101010'; g.fillRect(0, 0, 256, 192);
    g.strokeStyle = '#f2f2f2'; g.lineWidth = 3; g.beginPath();
    for (let i = 0; i < 420; i++) { const a = i * 0.1, r = i * 0.21; g.lineTo(128 + r * Math.cos(a), 96 + r * Math.sin(a) * 0.8); }
    g.stroke();
  } else {                // hành lang vô tận
    g.fillStyle = '#cfcfcf'; g.fillRect(0, 0, 256, 192);
    g.strokeStyle = '#111'; g.lineWidth = 3;
    [[0, 0, 100, 70], [256, 0, 156, 70], [0, 192, 100, 122], [256, 192, 156, 122]].forEach(function (l) { g.beginPath(); g.moveTo(l[0], l[1]); g.lineTo(l[2], l[3]); g.stroke(); });
    g.fillStyle = '#080808'; g.fillRect(100, 70, 56, 52); g.fillStyle = '#eee'; g.fillRect(125, 92, 6, 26);
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = AN; ART[k] = t; return t;
}
const FR1 = M(0x9a9a9a, 0.4), FR2 = M(0x0b0b0b, 0.5);
function painting(p, x, y, z, ry, w, h, k) {   // mặt tranh quay về +z (xoay ry để quay vào phòng)
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry;
  g.add(mk(w + 0.8, h + 0.8, 0.1, FR1, 0, 0, 0.05));
  g.add(mk(w + 0.4, h + 0.4, 0.13, FR2, 0, 0, 0.065));
  const pm = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: art(k), roughness: 0.9 }));
  pm.position.z = 0.14; g.add(pm);
  g.add(mk(Math.min(w * 0.6, 3), 0.1, 0.45, MT.lamp, 0, h / 2 + 0.7, 0.3));   // đèn rọi tranh
  p.add(g); return g;
}

// ===== ĐÈN TRẦN trong từng phòng (đèn thả có ánh sáng thật) =====
function lamp(p, x, ceilY, drop, z, col, inten, dist, flick) {
  const g = new THREE.Group(); g.position.set(x, ceilY - drop, z);
  g.add(mk(0.04, drop, 0.04, MT.bk, 0, drop / 2, 0));
  const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.8, 0.5, 14, 1, true), new THREE.MeshStandardMaterial({ color: 0x151515, side: THREE.DoubleSide, roughness: 0.6 }));
  shade.position.y = 0.1; g.add(shade);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.24, 10, 8), new THREE.MeshBasicMaterial({ color: col })); bulb.position.y = -0.05; g.add(bulb);
  const l = new THREE.PointLight(col, inten, dist, 1.5); l.position.y = -0.4; g.add(l);
  LT.push({ l: l, base: inten, flick: !!flick }); p.add(g); return l;
}

// ===== ĐÈN CHÙM ở sảnh =====
const CAND = new THREE.CylinderGeometry(0.1, 0.1, 0.55, 8), FLAME = new THREE.SphereGeometry(0.09, 6, 6), CRYS = new THREE.OctahedronGeometry(0.14);
function chandelier(p, x, y, z) {
  const g = new THREE.Group(); g.position.set(x, y, z);
  g.add(mk(0.1, 2.8, 0.1, MT.bk, 0, 1.4, 0));            // xích treo lên xà
  g.add(mk(0.7, 0.35, 0.7, IRON, 0, 0.1, 0));
  g.add(mk(0.28, 2.6, 0.28, IRON, 0, -1.3, 0));          // trục giữa
  [[2.7, -0.9, 14], [1.9, -1.7, 10], [1.1, -2.4, 6]].forEach(function (r) {
    const R = r[0], yy = r[1], n = r[2];
    const t = new THREE.Mesh(new THREE.TorusGeometry(R, 0.07, 6, 40), IRON); t.rotation.x = Math.PI / 2; t.position.y = yy; g.add(t);
    for (let s = 0; s < 4; s++) { const th = s * Math.PI / 2, sp = mk(R, 0.05, 0.05, IRON, Math.cos(th) * R / 2, yy, Math.sin(th) * R / 2); sp.rotation.y = -th; g.add(sp); }
    for (let i = 0; i < n; i++) {

}
function arc(cx, cz, r, a0, a1, n, w, base) {
  const da = (a1 - a0) / n, len = r * Math.abs(da) * 1.04;

    const a = a0 + (i + 0.5) * da, top = base + (i + 1) * RISE, ca = Math.cos(a), sa = Math.sin(a);
    box(B, cx + r * ca, top / 2, cz + r * sa, w, top, len, i % 2 ? STB : STW).rotation.y = -a;
    [-1, 1].forEach(function (s) {
      const o = r + s * (w / 2 - 0.05);

      box(B, cx + o * ca, top + RH + 0.06, cz + o * sa, 0.24, 0.12, len, CAP).rotation.y = -a;
    });
  }

}

lamp(U, 65, UC, 1.6, 43.5, 0xb8c4ff, 0.7, 20, true);     // phòng bí mật

// Cửa chính (thoát hiểm), chìa khóa, pin
box(G, EXIT[0], DH / 2, EXIT[1], 4, DH, 0.25, M(0x4a0808, 0.6));
const key = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.15, 12, 24), new THREE.MeshBasicMaterial({ color: 0xfff3b0 }));
key.position.set(KEY[0], 1.35, KEY[1]); key.rotation.x = Math.PI / 2; G.add(key);
BAT.forEach(function (b) { box(b[2] ? U : G, b[0], b[2] + 0.6, b[1], 0.5, 0.8, 0.5, new THREE.MeshBasicMaterial({ color: 0xdddddd })); });

function showFloors(n) { G.visible = n !== 2; U.visible = n !== 1; $('fl').textContent = ['', 'TẦNG TRỆT', 'TẦNG LẦU', 'CẢ HAI'][n]; }
showFloors(3);
let labelsOn = true, bright = true;

// ===== CAMERA: nhìn từ trên xuống / bay tự do =====
const keys = {}; let tx = CX, tz = D / 2, h = 95, mode = 'top', yaw = 0, pitch = -0.9, speed = 16, drag = false;
const fpos = new THREE.Vector3(), dom = renderer.domElement;
const HELP = {
  top: '<kbd>W A S D</kbd> kéo bản đồ &nbsp; <kbd>Q</kbd>/<kbd>E</kbd> phóng to / thu nhỏ',
  fly: 'Bấm vào màn hình để khóa chuột (<kbd>Esc</kbd> nhả) hoặc giữ chuột để xoay<br><kbd>W A S D</kbd> bay &nbsp; <kbd>Space</kbd> lên &nbsp; <kbd>Shift</kbd> xuống &nbsp; <kbd>Z</kbd>/<kbd>X</kbd> chậm / nhanh<br><kbd>B</kbd> tủ sách &nbsp; <kbd>H</kbd> cửa chính &nbsp; <kbd>N</kbd> đèn chùm &nbsp; <kbd>G</kbd> hành lang 2 nhìn xuống &nbsp; <kbd>Y</kbd> hành lang 2 &nbsp; <kbd>T</kbd> hành lang 1 &nbsp; <kbd>O</kbd> phòng game &nbsp; <kbd>J</kbd> phòng bí mật &nbsp; <kbd>U</kbd> thư viện (tường đông)'
};
function setMode(m) {
  mode = m;
  if (m === 'fly') { camera.up.set(0, 1, 0); camera.fov = 70; camera.rotation.order = 'YXZ'; fpos.set(tx, 42, tz + 38); yaw = 0; pitch = -0.9; }
  else { camera.up.set(0, 0, -1); camera.fov = 50; if (document.pointerLockElement) document.exitPointerLock(); }
  camera.updateProjectionMatrix();
  $('mode').textContent = m === 'fly' ? 'BAY TỰ DO' : 'NHÌN TỪ TRÊN';
  $('help').innerHTML = HELP[m];
}
setMode('top');
dom.addEventListener('click', function () { if (mode === 'fly' && !document.pointerLockElement) dom.requestPointerLock(); });
dom.addEventListener('mousedown', function () { drag = true; });
addEventListener('mouseup', function () { drag = false; });
addEventListener('mousemove', function (e) {
  if (mode !== 'fly' || !(document.pointerLockElement === dom || drag)) return;
  yaw -= e.movementX * 0.003; pitch = Math.max(-1.55, Math.min(1.55, pitch - e.movementY * 0.003));
});
addEventListener('keydown', function (e) {
  keys[e.code] = true;
  if (e.code === 'KeyV') setMode(mode === 'top' ? 'fly' : 'top');
  if (e.code === 'Digit1') showFloors(1);
  if (e.code === 'Digit2') showFloors(2);
  if (e.code === 'Digit3') showFloors(3);
  if (e.code === 'KeyC') CE.visible = !CE.visible;
  if (e.code === 'KeyK') { ri = (ri + 1) % 3; setRes(); st('Độ phân giải x' + RATIOS[ri]); }
  if (e.code === 'KeyL') { labelsOn = !labelsOn; scene.traverse(function (o) { if (o.userData.label) o.visible = labelsOn; }); }
  if (e.code === 'KeyF') { bright = !bright; amb.intensity = bright ? 0.26 : 0.04; sun.intensity = bright ? 0.45 : 0; hemi.intensity = bright ? 0.25 : 0.03; LT.forEach(function (o) { o.l.visible = bright; }); }
  if (mode === 'fly') {
    if (e.code === 'KeyB') { fpos.set(CX, 2, 9); yaw = Math.PI; pitch = 0.55; showFloors(1); }          // thay dòng KeyB cũ: nhìn tủ sách
if (e.code === 'KeyY') { fpos.set(6, F2 + 1.6, 15); yaw = -Math.PI / 2; pitch = 0; showFloors(2); }   // thay dòng KeyY cũ: hành lang 2, nhìn tủ trốn
if (e.code === 'KeyM') { fpos.set(49, 1.6, 31.8); yaw = -Math.PI / 2; pitch = 0.15; showFloors(1); }  // thêm: tủ trốn ở sảnh
if (e.code === 'KeyR') { fpos.set(CX - 3, 2.6, FZ0 + 3); yaw = 0; pitch = 0.1; showFloors(3); }       // thêm: tay vịn cầu thang
    if (e.code === 'KeyT') { fpos.set(2, 1.6, 3.5); yaw = -Math.PI / 2; pitch = 0; showFloors(1); }
    if (e.code === 'KeyH') { fpos.set(CX, 1.6, D - 1.5); yaw = 0; pitch = 0.3; showFloors(3); }
    if (e.code === 'KeyB') { fpos.set(CX, 2, 11); yaw = Math.PI; pitch = 0.1; showFloors(1); }
    if (e.code === 'KeyN') { fpos.set(CX - HH + 2.5, F2 + 1.6, CHZ); yaw = -Math.PI / 2; pitch = 0.05; showFloors(3); }
    if (e.code === 'KeyG') { fpos.set(CX, F2 + 1.6, HZ - 2.5); yaw = Math.PI; pitch = -0.35; showFloors(3); }
    if (e.code === 'KeyY') { fpos.set(2, F2 + 1.6, (NZ + HZ) / 2); yaw = -Math.PI / 2; pitch = 0; showFloors(2); }
    if (e.code === 'KeyO') { fpos.set(12.5, F2 + 1.6, T2 + 2); yaw = Math.PI / 2 + 0.35; pitch = -0.1; showFloors(2); }
    if (e.code === 'KeyJ') { fpos.set(70.5, F2 + 1.6, KS + 2); yaw = 2.5; pitch = -0.1; showFloors(2); }
    if (e.code === 'KeyU') { fpos.set(56, F2 + 1.6, 6); yaw = -Math.PI / 2; pitch = 0; showFloors(2); }
    if (e.code === 'KeyZ') speed = Math.max(2, speed / 1.4);
    if (e.code === 'KeyX') speed = Math.min(120, speed * 1.4);
    if (e.code === 'Space') e.preventDefault();
  }
});
addEventListener('keyup', function (e) { keys[e.code] = false; });

const clock = new THREE.Clock(); let tt = 0;
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05); tt += dt;
  pend.rotation.z = Math.sin(tt * 3) * 0.28;            // quả lắc đồng hồ
  rocker.rotation.x = Math.sin(tt * 1.6) * 0.07;        // ghế bập bênh
  mob.rotation.y += dt * 0.4;                           // chuông trên nôi
  chand.rotation.y += dt * 0.08;                        // đèn chùm xoay nhẹ
  if (bright) LT.forEach(function (o) { if (o.flick && Math.random() < 0.1) o.l.intensity = o.base * (0.65 + Math.random() * 0.5); });
  if (mode === 'top') {
    const s = h * 0.012;
    if (keys.KeyW) tz -= s; if (keys.KeyS) tz += s;
    if (keys.KeyA) tx -= s; if (keys.KeyD) tx += s;
    if (keys.KeyQ) h = Math.max(8, h - 1); if (keys.KeyE) h = Math.min(260, h + 1);
    camera.position.set(tx, h, tz); camera.lookAt(tx, 0, tz);
  } else {
    const cp = Math.cos(pitch), sp = Math.sin(pitch), sy = Math.sin(yaw), cy = Math.cos(yaw);
    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    const u = (keys.Space ? 1 : 0) - (keys.ShiftLeft || keys.ShiftRight ? 1 : 0);
    fpos.x += (-sy * cp * f + cy * r) * speed * dt;
    fpos.y += (sp * f + u) * speed * dt;
    fpos.z += (-cy * cp * f - sy * r) * speed * dt;
    fpos.y = Math.max(0.3, fpos.y);
    camera.position.copy(fpos); camera.rotation.set(pitch, yaw, 0);
  }
  renderer.render(scene, camera);
})();
}
</script>
