<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Xem bản đồ nhà</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:'Segoe UI',Arial,sans-serif}
  #info{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,.78);padding:10px 14px;font-size:14px;line-height:1.7;border:1px solid #522;max-width:340px}
  #info b.c{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:middle}
  #mode,#fl{color:#ffd700;font-weight:700}
  kbd{background:#333;border:1px solid #666;border-radius:3px;padding:0 5px;font-size:12px}
  #err{display:none;position:fixed;left:0;right:0;bottom:0;background:#b00;color:#fff;padding:10px 14px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="info">
  <div>Chế độ: <span id="mode"></span> (<kbd>V</kbd> đổi) &nbsp; Đang xem: <span id="fl"></span></div>
  <div><kbd>1</kbd> tầng trệt &nbsp; <kbd>2</kbd> tầng lầu &nbsp; <kbd>3</kbd> cả hai &nbsp; <kbd>L</kbd> bật/tắt tên phòng</div>
  <div><b class="c" style="background:#ffd700"></b>Chìa khóa (trong phòng kho)</div>
  <div><b class="c" style="background:#33ff66"></b>Pin (4 cái) &nbsp; <b class="c" style="background:#8b4513"></b>Cửa thoát hiểm</div>
  <div><b class="c" style="background:#ff9933"></b>Cầu thang 1 &nbsp; <b class="c" style="background:#3399ff"></b>Cầu thang 2</div>
  <hr>
  <div id="help"></div>
  <div><kbd>F</kbd> sáng / tối</div>
</div>
<div id="err"></div>

<script>
const $ = id => document.getElementById(id);
try {
// =====================================================
//  BẢN ĐỒ NHÀ - đơn vị là mét. x chạy sang phải (đông), z chạy xuống (nam)
//  Nhà rộng X 0..32, dài Z 0..26. Tầng trệt cao 3m, tầng lầu bắt đầu ở độ cao 3.2m
// =====================================================
const WT = 0.3;          // độ dày tường
const WH = 3.0;          // chiều cao tường
const FLOOR2 = 3.2;      // độ cao sàn tầng lầu
const DOOR_H = 2.4;      // chiều cao cửa đi

// Các phòng tầng trệt: [tên, x1, z1, x2, z2, màu sàn]
const ROOMS = [
  ['PHÒNG KHÁCH',   0,  0, 16, 12, 0x6b3a2a],
  ['PHÒNG NGỦ',    16,  0, 32, 12, 0x2f4a6b],
  ['HÀNH LANG 1',   0, 12, 32, 16, 0x555555],
  ['PHÒNG KHO',     0, 16, 10, 26, 0x8a7a4a],
  ['HÀNH LANG 2',  10, 16, 14, 26, 0x666666],
  ['SẢNH CẦU THANG',14, 16, 32, 26, 0x3a5a3a],
];

// Tường tầng trệt: [hướng, từ, đến, vị trí cố định, [các cửa đi [bắt đầu, kết thúc]]]
//  'x' = tường chạy ngang (cố định z) | 'z' = tường chạy dọc (cố định x)
const WALLS_GROUND = [
  ['x', 0, 32,  0, []],                    // tường ngoài phía bắc
  ['x', 0, 32, 26, []],                    // tường ngoài phía nam
  ['z', 0, 26,  0, []],                    // tường ngoài phía tây
  ['z', 0, 26, 32, [[13, 15]]],            // tường ngoài phía đông (chừa chỗ cho cửa thoát hiểm)
  ['x', 0, 32, 12, [[5, 7.5], [23, 25.5]]],// phòng khách + phòng ngủ <-> hành lang 1
  ['z', 0, 12, 16, []],                    // tường giữa phòng khách và phòng ngủ
  ['x', 0, 32, 16, [[10, 14], [28, 30.5]]],// hành lang 1 <-> phòng kho / hành lang 2 / sảnh
  ['z', 16, 26, 10, [[21, 23.5]]],         // phòng kho <-> hành lang 2
  ['z', 16, 26, 14, [[19, 22]]],           // hành lang 2 <-> sảnh cầu thang
];

// Tường tầng lầu (cùng khung ngoài, thêm 1 tường ngăn)
const WALLS_UPPER = [
  ['x', 0, 32,  0, []], ['x', 0, 32, 26, []],
  ['z', 0, 26,  0, []], ['z', 0, 26, 32, []],
  ['x', 0, 15, 16, [[6, 9]]],              // tường ngăn phòng lầu phía bắc
];

// Cầu thang: 16 bậc, mỗi bậc cao 0.2m (đủ lên 3.2m), sâu 0.75m, rộng 3.5m
const STEPS = 16, RISE = 0.2, RUN = 0.75, STAIR_W = 3.5;
const STAIR1 = { x0: 15, dir: +1, z: 18.75 };   // đi lên về phía đông
const STAIR2 = { x0: 27, dir: -1, z: 23.25 };   // đi lên về phía tây (ngược chiều, nằm kế bên)
// Lỗ trên sàn tầng lầu cho cầu thang: x 15..27, z 17..25

// Vị trí các vật
const KEY_POS  = [5, 21];                        // chìa khóa (phòng kho)
const BAT_POS  = [[3, 3, 0], [28, 4, 0], [30, 24, 0], [4, 10, FLOOR2]]; // [x, z, độ cao sàn]
const EXIT_POS = [32, 14];                       // cửa thoát hiểm
// =====================================================
//  HẾT PHẦN BẢN ĐỒ (bên dưới là phần dựng hình)
// =====================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101010);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const amb = new THREE.AmbientLight(0xffffff, 0.85); scene.add(amb);
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(20, 60, 10); scene.add(sun);

const G = new THREE.Group(), U = new THREE.Group(), B = new THREE.Group(); // tầng trệt, tầng lầu, chung
scene.add(G, U, B);
const MAT = (c, r = .9) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const WALL = MAT(0x7a6a5e);

function box(p, x, y, z, w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); p.add(m); return m;
}
function wall(p, [axis, a, b, f, doors], y0) {
  const segs = []; let pos = a;
  doors.forEach(([s, e]) => { if (s > pos) segs.push([pos, s]); pos = e; });
  if (pos < b) segs.push([pos, b]);
  const put = (s, e, yy, hh) => axis === 'x'
    ? box(p, (s + e) / 2, yy, f, e - s, hh, WT, WALL)
    : box(p, f, yy, (s + e) / 2, WT, hh, e - s, WALL);
  segs.forEach(([s, e]) => put(s, e, y0 + WH / 2, WH));
  doors.forEach(([s, e]) => put(s, e, y0 + DOOR_H + (WH - DOOR_H) / 2, WH - DOOR_H)); // thanh ngang trên cửa
}
function label(p, text, x, y, z) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.65)'; g.fillRect(0, 0, 320, 64);
  g.fillStyle = '#fff'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.fillText(text, 160, 43);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(7, 1.4, 1); s.position.set(x, y, z); s.userData.label = true; p.add(s);
}

// Sàn từng phòng + tên phòng + tường tầng trệt
ROOMS.forEach(([name, x1, z1, x2, z2, col]) => {
  box(G, (x1 + x2) / 2, 0.02, (z1 + z2) / 2, x2 - x1, 0.04, z2 - z1, MAT(col, 1));
  label(G, name, (x1 + x2) / 2, 2.4, (z1 + z2) / 2);
});
WALLS_GROUND.forEach(w => wall(G, w, 0));

// Tầng lầu: sàn (chừa lỗ cầu thang), tường, lan can
const slab = (x1, z1, x2, z2) => box(U, (x1 + x2) / 2, FLOOR2 - .1, (z1 + z2) / 2, x2 - x1, .2, z2 - z1, MAT(0x4a4038, 1));
slab(0, 0, 32, 17); slab(0, 25, 32, 26); slab(0, 17, 15, 25); slab(27, 17, 32, 25);
WALLS_UPPER.forEach(w => wall(U, w, FLOOR2));
const RAIL = MAT(0xaa8844);
const rail = (x1, z1, x2, z2) => box(U, (x1 + x2) / 2, FLOOR2 + .5, (z1 + z2) / 2, Math.max(.1, x2 - x1), 1, Math.max(.1, z2 - z1), RAIL);
rail(15, 17, 27, 17); rail(15, 25, 27, 25); rail(27, 20.5, 27, 25); rail(15, 17, 15, 21.5); // chừa lối ra khỏi 2 cầu thang
label(U, 'TẦNG LẦU', 16, FLOOR2 + 2.4, 8);
label(U, 'CẦU THANG (nhìn từ trên)', 21, FLOOR2 + 2.4, 21);

// Cầu thang (hiện ở cả 2 tầng)
function stairs(s, color) {
  const m = MAT(color, .8);
  for (let i = 0; i < STEPS; i++) {
    const top = (i + 1) * RISE, cx = s.x0 + s.dir * (i + .5) * RUN;
    box(B, cx, top / 2, s.z, RUN, top, STAIR_W, m);
  }
}
stairs(STAIR1, 0xff9933); stairs(STAIR2, 0x3399ff);
label(G, 'CẦU THANG 1 (lên →)', 21, 1.2, 18.75);
label(G, 'CẦU THANG 2 (← lên)', 21, 1.2, 23.25);

// Cửa thoát hiểm, chìa khóa, pin
box(G, EXIT_POS[0], DOOR_H / 2, EXIT_POS[1], .25, DOOR_H, 2, MAT(0x8b4513));
const key = new THREE.Mesh(new THREE.TorusGeometry(.4, .12, 8, 16), new THREE.MeshBasicMaterial({ color: 0xffd700 }));
key.position.set(KEY_POS[0], 1, KEY_POS[1]); key.rotation.x = Math.PI / 2; G.add(key);
BAT_POS.forEach(([x, z, y]) => box(y ? U : G, x, y + .6, z, .5, .8, .5, new THREE.MeshBasicMaterial({ color: 0x33ff66 })));

// Chọn tầng để xem
let floors = 1;
function showFloors(n) {
  floors = n; G.visible = n !== 2; U.visible = n !== 1;
  $('fl').innerText = ['', 'TẦNG TRỆT', 'TẦNG LẦU', 'CẢ HAI'][n];
}
showFloors(1);
let labelsOn = true;

// =====================================================
//  CAMERA: nhìn từ trên xuống  /  bay tự do
// =====================================================
const keys = {}; let tx = 16, tz = 13, h = 55, bright = true;
let mode = 'top', yaw = 0, pitch = -0.9, speed = 10, drag = false;
const fpos = new THREE.Vector3(), dom = renderer.domElement;
const HELP = {
  top: '<kbd>W A S D</kbd> kéo bản đồ &nbsp; <kbd>Q</kbd>/<kbd>E</kbd> phóng to / thu nhỏ',
  fly: '<kbd>Bấm vào màn hình</kbd> khóa chuột (<kbd>Esc</kbd> nhả) hoặc giữ chuột để xoay<br>' +
       '<kbd>W A S D</kbd> bay &nbsp; <kbd>Space</kbd> lên &nbsp; <kbd>Shift</kbd> xuống &nbsp; <kbd>Z</kbd>/<kbd>X</kbd> chậm / nhanh<br>' +
       '<kbd>T</kbd> đứng ở Hành lang 1 (tầm mắt) &nbsp; <kbd>G</kbd> đứng ở tầng lầu'
};
function setMode(m) {
  mode = m;
  if (m === 'fly') { camera.up.set(0, 1, 0); camera.fov = 70; camera.rotation.order = 'YXZ'; fpos.set(tx, 25, tz + 18); yaw = 0; pitch = -0.9; }
  else { camera.up.set(0, 0, -1); camera.fov = 50; if (document.pointerLockElement) document.exitPointerLock(); }
  camera.updateProjectionMatrix();
  $('mode').innerText = m === 'fly' ? 'BAY TỰ DO' : 'NHÌN TỪ TRÊN';
  $('help').innerHTML = HELP[m];
}
setMode('top');

dom.addEventListener('click', () => { if (mode === 'fly' && !document.pointerLockElement) dom.requestPointerLock(); });
dom.addEventListener('mousedown', () => drag = true);
addEventListener('mouseup', () => drag = false);
addEventListener('mousemove', e => {
  if (mode !== 'fly' || !(document.pointerLockElement === dom || drag)) return;
  yaw -= e.movementX * .003; pitch = Math.max(-1.55, Math.min(1.55, pitch - e.movementY * .003));
});
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyV') setMode(mode === 'top' ? 'fly' : 'top');
  if (e.code === 'Digit1') showFloors(1);
  if (e.code === 'Digit2') showFloors(2);
  if (e.code === 'Digit3') showFloors(3);
  if (e.code === 'KeyL') { labelsOn = !labelsOn; scene.traverse(o => { if (o.userData.label) o.visible = labelsOn; }); }
  if (e.code === 'KeyF') { bright = !bright; amb.intensity = bright ? .85 : .15; sun.intensity = bright ? .6 : 0; scene.background.set(bright ? 0x101010 : 0x030000); }
  if (mode === 'fly') {
    if (e.code === 'KeyT') { fpos.set(2, 1.6, 14); yaw = -Math.PI / 2; pitch = 0; showFloors(1); }
    if (e.code === 'KeyG') { fpos.set(16, FLOOR2 + 1.6, 8); yaw = 0; pitch = 0; showFloors(2); }
    if (e.code === 'KeyZ') speed = Math.max(2, speed / 1.4);
    if (e.code === 'KeyX') speed = Math.min(80, speed * 1.4);
    if (e.code === 'Space') e.preventDefault();
  }
});
addEventListener('keyup', e => keys[e.code] = false);

const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  if (mode === 'top') {
    const s = h * .012;
    if (keys.KeyW) tz -= s; if (keys.KeyS) tz += s;
    if (keys.KeyA) tx -= s; if (keys.KeyD) tx += s;
    if (keys.KeyQ) h = Math.max(8, h - .8); if (keys.KeyE) h = Math.min(160, h + .8);
    camera.position.set(tx, h, tz); camera.lookAt(tx, 0, tz);
  } else {
    const cp = Math.cos(pitch), sp = Math.sin(pitch), sy = Math.sin(yaw), cy = Math.cos(yaw);
    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    const u = (keys.Space ? 1 : 0) - (keys.ShiftLeft || keys.ShiftRight ? 1 : 0);
    fpos.x += (-sy * cp * f + cy * r) * speed * dt;
    fpos.y += (sp * f + u) * speed * dt;
    fpos.z += (-cy * cp * f - sy * r) * speed * dt;
    fpos.y = Math.max(.3, fpos.y);
    camera.position.copy(fpos); camera.rotation.set(pitch, yaw, 0);
  }
  renderer.render(scene, camera);
})();
} catch (e) {
  const el = $('err'); el.innerText = 'Lỗi: ' + e.message; el.style.display = 'block';
}
</script>
</body>
</html>
