<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Xem bản đồ nhà</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:'Segoe UI',Arial,sans-serif}
  #info{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,.78);padding:10px 14px;font-size:14px;line-height:1.7;border:1px solid #522;max-width:350px}
  #info b.c{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:middle}
  #mode,#fl{color:#ffd700;font-weight:700}
  kbd{background:#333;border:1px solid #666;border-radius:3px;padding:0 5px;font-size:12px}
  #err{display:none;position:fixed;left:0;right:0;bottom:0;background:#b00;color:#fff;padding:10px 14px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="info">
  <div>Chế độ: <span id="mode"></span> (<kbd>V</kbd> đổi) &nbsp; Đang xem: <span id="fl"></span></div>
  <div><kbd>1</kbd> tầng trệt &nbsp; <kbd>2</kbd> tầng lầu &nbsp; <kbd>3</kbd> cả hai &nbsp; <kbd>L</kbd> tên phòng</div>
  <div><b class="c" style="background:#ffd700"></b>Chìa khóa (kho) &nbsp; <b class="c" style="background:#33ff66"></b>Pin (4) &nbsp; <b class="c" style="background:#8b4513"></b>Cửa chính</div>
  <div><b class="c" style="background:#ff9933"></b>Thang giữa + chiếu nghỉ &nbsp; <b class="c" style="background:#3399ff"></b>2 thang bên</div>
  <hr>
  <div id="help"></div>
  <div><kbd>F</kbd> sáng / tối</div>
</div>
<div id="err"></div>

<script>
const $ = id => document.getElementById(id);
try {
// =====================================================
//  BẢN ĐỒ NHÀ KIỂU DINH THỰ - đơn vị mét
//  x chạy sang phải (đông), z chạy xuống (nam). Nhà rộng 48 x dài 26.
//  Cửa chính ở tường nam (z = 26), giữa nhà (x = 24).
// =====================================================
const WT = 0.3, WH = 3.0, FLOOR2 = 3.2, DOOR_H = 2.4;

// Phòng: [tên, x1, z1, x2, z2, màu sàn]
const ROOMS_G = [
  ['HÀNH LANG 1',  0, 0, 48,  5, 0x555555],
  ['PHÒNG KHÁCH',  0, 5, 12, 26, 0x6b3a2a],
  ['SẢNH',        12, 5, 36, 26, 0x3a5a3a],
  ['PHÒNG KHO',   36, 5, 48, 26, 0x8a7a4a],
];
const ROOMS_U = [
  ['PHÒNG NGỦ',        0,  0, 24,  9, 0x2f4a6b],
  ['PHÒNG LÀM VIỆC',  24,  0, 48,  9, 0x5a4a6b],
  ['HÀNH LANG 2',      0,  9, 48, 12, 0x666666],
  ['PHÒNG TẮM',        0, 12, 12, 26, 0x4a6a6a],
  ['BAN CÔNG TÂY',    12, 12, 16, 26, 0x777777],
  ['BAN CÔNG ĐÔNG',   32, 12, 36, 26, 0x777777],
  ['THƯ VIỆN',        36, 12, 48, 26, 0x6b5a3a],
];

// Tường: [hướng, từ, đến, vị trí cố định, [cửa [bắt đầu, kết thúc]]]  ('x' = chạy ngang, 'z' = chạy dọc; cửa xếp từ nhỏ đến lớn)
const WALLS_G = [
  ['x', 0, 48, 0, []], ['x', 0, 48, 26, [[22.5, 25.5]]],     // tường nam chừa cửa chính
  ['z', 0, 26, 0, []], ['z', 0, 26, 48, []],
  ['x', 0, 48, 5, [[4, 7], [19, 29], [41, 44]]],             // hành lang 1 -> khách | sảnh | kho
  ['z', 5, 26, 12, [[18, 21]]], ['z', 5, 26, 36, [[18, 21]]],// khách <-> sảnh <-> kho
];
const WALLS_U = [
  ['x', 0, 48, 0, []], ['x', 0, 48, 26, []],
  ['z', 0, 26, 0, []], ['z', 0, 26, 48, []],
  ['x', 0, 48, 9, [[8, 11], [36, 39]]], ['z', 0, 9, 24, []], // phòng ngủ | phòng làm việc
  ['x', 0, 12, 12, [[3, 6]]], ['x', 36, 48, 12, [[42, 45]]], // phòng tắm | thư viện
  ['z', 12, 26, 12, []], ['z', 12, 26, 36, []],
];

// CẦU THANG ĐÔI KIỂU DINH THỰ
//  Thang giữa x20..28, z24 -> 20 (8 bậc, lên 1.6m) -> chiếu nghỉ x16..32, z16..20 (cao 1.6m)
//  Hai thang bên x16..20 và x28..32, z16 -> 12 (8 bậc, lên 3.2m) đổ vào hành lang 2
//  Lỗ trên sàn lầu: x16..32, z12..26
const RISE = 0.2, RUN = 0.5, RAIL_H = 1.0;

const KEY_POS  = [42, 15];                                    // chìa khóa (phòng kho)
const BAT_POS  = [[6, 16, 0], [24, 2.5, 0], [42, 22, 0], [6, 3, FLOOR2]]; // [x, z, độ cao sàn]
const EXIT_POS = [24, 26];                                    // cửa chính
// =====================================================
//  HẾT PHẦN BẢN ĐỒ
// =====================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101010);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const amb = new THREE.AmbientLight(0xffffff, 0.85); scene.add(amb);
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(20, 60, 10); scene.add(sun);

const G = new THREE.Group(), U = new THREE.Group(), B = new THREE.Group(); // tầng trệt, tầng lầu, chung
scene.add(G, U, B);
const MAT = (c, r = .9) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const WALL = MAT(0x7a6a5e), RAILMAT = MAT(0xaa8844, .6), CARPET = MAT(0x8b1a1a, 1), STONE = MAT(0xcfc8b8, .7);

function box(p, x, y, z, w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); p.add(m); return m;
}
function wall(p, [axis, a, b, f, doors], y0) {
  const segs = []; let pos = a;
  doors.forEach(([s, e]) => { if (s > pos) segs.push([pos, s]); pos = e; });
  if (pos < b) segs.push([pos, b]);
  const put = (s, e, yy, hh) => axis === 'x'
    ? box(p, (s + e) / 2, yy, f, e - s, hh, WT, WALL)
    : box(p, f, yy, (s + e) / 2, WT, hh, e - s, WALL);
  segs.forEach(([s, e]) => put(s, e, y0 + WH / 2, WH));
  doors.forEach(([s, e]) => put(s, e, y0 + DOOR_H + (WH - DOOR_H) / 2, WH - DOOR_H));
}
function label(p, text, x, y, z, w = 5) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.65)'; g.fillRect(0, 0, 320, 64);
  g.fillStyle = '#fff'; g.font = 'bold 28px sans-serif'; g.textAlign = 'center'; g.fillText(text, 160, 42);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(w, w / 5, 1); s.position.set(x, y, z); s.userData.label = true; p.add(s);
}

// Sàn từng phòng + tên + tường
const rooms = (p, list, y0) => list.forEach(([n, x1, z1, x2, z2, col]) => {
  box(p, (x1 + x2) / 2, y0 + .02, (z1 + z2) / 2, x2 - x1, .04, z2 - z1, MAT(col, 1));
  label(p, n, (x1 + x2) / 2, y0 + 2.4, (z1 + z2) / 2, Math.min(5, (x2 - x1) * .8));
});
rooms(G, ROOMS_G, 0); WALLS_G.forEach(w => wall(G, w, 0));
rooms(U, ROOMS_U, FLOOR2); WALLS_U.forEach(w => wall(U, w, FLOOR2));

// Sàn tầng lầu: chừa lỗ x16..32, z12..26 cho cầu thang
const SLAB = MAT(0x4a4038, 1);
const slab = (x1, z1, x2, z2) => box(U, (x1 + x2) / 2, FLOOR2 - .1, (z1 + z2) / 2, x2 - x1, .2, z2 - z1, SLAB);
slab(0, 0, 48, 12); slab(0, 12, 16, 26); slab(32, 12, 48, 26);

// Lan can tầng lầu quanh lỗ (mép tây, mép đông, và mép bắc giữa 2 thang)
const rail = (p, x1, z1, x2, z2, y0) => box(p, (x1 + x2) / 2, y0 + RAIL_H / 2, (z1 + z2) / 2, Math.max(.1, x2 - x1), RAIL_H, Math.max(.1, z2 - z1), RAILMAT);
rail(U, 16, 16, 16, 26, FLOOR2); rail(U, 32, 16, 32, 26, FLOOR2); rail(U, 20, 12, 28, 12, FLOOR2);

// Một đợt cầu thang: bắt đầu (x0,z0), hướng (dx,dz), rộng w, n bậc, độ cao nền base; có tay vịn đặc 2 bên
function flight(x0, z0, dx, dz, w, n, base, color, carpet) {
  const m = MAT(color, .8);
  for (let i = 0; i < n; i++) {
    const top = base + (i + 1) * RISE, c = (i + .5) * RUN, cx = x0 + dx * c, cz = z0 + dz * c;
    box(B, cx, top / 2, cz, dx ? RUN : w, top, dz ? RUN : w, m);
    if (carpet) box(B, cx, top + .02, cz, dx ? RUN : w * .6, .04, dz ? RUN : w * .6, CARPET);
    [-1, 1].forEach(s => { const o = s * (w / 2 - .05);
      box(B, cx + (dz ? o : 0), top + RAIL_H / 2, cz + (dx ? o : 0), dx ? RUN : .1, RAIL_H, dz ? RUN : .1, RAILMAT); });
  }
}
flight(24, 24, 0, -1, 8, 8, 0, 0xff9933, true);        // thang giữa, rộng 8m, thảm đỏ
box(B, 24, .8, 18, 16, 1.6, 4, MAT(0xff9933, .8));     // chiếu nghỉ x16..32, z16..20
box(B, 24, 1.62, 18, 6, .04, 4, CARPET);               // thảm trên chiếu nghỉ
flight(18, 16, 0, -1, 4, 8, 1.6, 0x3399ff);            // thang bên tây, tới 3.2m
flight(30, 16, 0, -1, 4, 8, 1.6, 0x3399ff);            // thang bên đông, tới 3.2m
// Lan can chiếu nghỉ (chừa chỗ thang giữa bước lên ở x20..28 phía nam)
rail(B, 16, 20, 20, 20, 1.6); rail(B, 28, 20, 32, 20, 1.6);   // mép nam 2 bên
rail(B, 16, 16, 16, 20, 1.6); rail(B, 32, 16, 32, 20, 1.6);   // mép tây, đông
rail(B, 20, 16, 28, 16, 1.6);                                 // mép bắc (giữa 2 thang bên)
// Cột đá ở 2 đầu chiếu nghỉ
[16, 32].forEach(x => { const col = new THREE.Mesh(new THREE.CylinderGeometry(.35, .4, 3.4, 16), STONE); col.position.set(x, 1.7, 20); B.add(col); });
label(B, 'CẦU THANG ĐÔI', 24, FLOOR2 + 2, 20, 4.5);

// Cửa chính (thoát hiểm), chìa khóa, pin
box(G, EXIT_POS[0], DOOR_H / 2, EXIT_POS[1], 3, DOOR_H, .25, MAT(0x8b4513));
const key = new THREE.Mesh(new THREE.TorusGeometry(.4, .12, 8, 16), new THREE.MeshBasicMaterial({ color: 0xffd700 }));
key.position.set(KEY_POS[0], 1, KEY_POS[1]); key.rotation.x = Math.PI / 2; G.add(key);
BAT_POS.forEach(([x, z, y]) => box(y ? U : G, x, y + .6, z, .5, .8, .5, new THREE.MeshBasicMaterial({ color: 0x33ff66 })));

function showFloors(n) { G.visible = n !== 2; U.visible = n !== 1; $('fl').innerText = ['', 'TẦNG TRỆT', 'TẦNG LẦU', 'CẢ HAI'][n]; }
showFloors(3);
let labelsOn = true;

// =====================================================
//  CAMERA: nhìn từ trên xuống  /  bay tự do
// =====================================================
const keys = {}; let tx = 24, tz = 13, h = 70, bright = true;
let mode = 'top', yaw = 0, pitch = -0.9, speed = 10, drag = false;
const fpos = new THREE.Vector3(), dom = renderer.domElement;
const HELP = {
  top: '<kbd>W A S D</kbd> kéo bản đồ &nbsp; <kbd>Q</kbd>/<kbd>E</kbd> phóng to / thu nhỏ',
  fly: '<kbd>Bấm vào màn hình</kbd> khóa chuột (<kbd>Esc</kbd> nhả) hoặc giữ chuột để xoay<br>' +
       '<kbd>W A S D</kbd> bay &nbsp; <kbd>Space</kbd> lên &nbsp; <kbd>Shift</kbd> xuống &nbsp; <kbd>Z</kbd>/<kbd>X</kbd> chậm / nhanh<br>' +
       '<kbd>H</kbd> cửa chính nhìn vào cầu thang &nbsp; <kbd>G</kbd> ban công tây nhìn sang &nbsp; <kbd>Y</kbd> hành lang 2 &nbsp; <kbd>T</kbd> hành lang 1'
};
function setMode(m) {
  mode = m;
  if (m === 'fly') { camera.up.set(0, 1, 0); camera.fov = 70; camera.rotation.order = 'YXZ'; fpos.set(tx, 32, tz + 22); yaw = 0; pitch = -0.9; }
  else { camera.up.set(0, 0, -1); camera.fov = 50; if (document.pointerLockElement) document.exitPointerLock(); }
  camera.updateProjectionMatrix();
  $('mode').innerText = m === 'fly' ? 'BAY TỰ DO' : 'NHÌN TỪ TRÊN';
  $('help').innerHTML = HELP[m];
}
setMode('top');

dom.addEventListener('click', () => { if (mode === 'fly' && !document.pointerLockElement) dom.requestPointerLock(); });
dom.addEventListener('mousedown', () => drag = true);
addEventListener('mouseup', () => drag = false);
addEventListener('mousemove', e => {
  if (mode !== 'fly' || !(document.pointerLockElement === dom || drag)) return;
  yaw -= e.movementX * .003; pitch = Math.max(-1.55, Math.min(1.55, pitch - e.movementY * .003));
});
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyV') setMode(mode === 'top' ? 'fly' : 'top');
  if (e.code === 'Digit1') showFloors(1);
  if (e.code === 'Digit2') showFloors(2);
  if (e.code === 'Digit3') showFloors(3);
  if (e.code === 'KeyL') { labelsOn = !labelsOn; scene.traverse(o => { if (o.userData.label) o.visible = labelsOn; }); }
  if (e.code === 'KeyF') { bright = !bright; amb.intensity = bright ? .85 : .15; sun.intensity = bright ? .6 : 0; scene.background.set(bright ? 0x101010 : 0x030000); }
  if (mode === 'fly') {
    if (e.code === 'KeyT') { fpos.set(2, 1.6, 2.5); yaw = -Math.PI / 2; pitch = 0; showFloors(1); }
    if (e.code === 'KeyH') { fpos.set(24, 1.6, 25.2); yaw = 0; pitch = .3; showFloors(3); }
    if (e.code === 'KeyG') { fpos.set(14, FLOOR2 + 1.6, 22); yaw = -Math.PI / 2; pitch = -.3; showFloors(3); }
    if (e.code === 'KeyY') { fpos.set(2, FLOOR2 + 1.6, 10.5); yaw = -Math.PI / 2; pitch = 0; showFloors(2); }
    if (e.code === 'KeyZ') speed = Math.max(2, speed / 1.4);
    if (e.code === 'KeyX') speed = Math.min(80, speed * 1.4);
    if (e.code === 'Space') e.preventDefault();
  }
});
addEventListener('keyup', e => keys[e.code] = false);

const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  if (mode === 'top') {
    const s = h * .012;
    if (keys.KeyW) tz -= s; if (keys.KeyS) tz += s;
    if (keys.KeyA) tx -= s; if (keys.KeyD) tx += s;
    if (keys.KeyQ) h = Math.max(8, h - .8); if (keys.KeyE) h = Math.min(160, h + .8);
    camera.position.set(tx, h, tz); camera.lookAt(tx, 0, tz);
  } else {
    const cp = Math.cos(pitch), sp = Math.sin(pitch), sy = Math.sin(yaw), cy = Math.cos(yaw);
    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    const u = (keys.Space ? 1 : 0) - (keys.ShiftLeft || keys.ShiftRight ? 1 : 0);
    fpos.x += (-sy * cp * f + cy * r) * speed * dt;
    fpos.y += (sp * f + u) * speed * dt;
    fpos.z += (-cy * cp * f - sy * r) * speed * dt;
    fpos.y = Math.max(.3, fpos.y);
    camera.position.copy(fpos); camera.rotation.set(pitch, yaw, 0);
  }
  renderer.render(scene, camera);
})();
} catch (e) {
  const el = $('err'); el.innerText = 'Lỗi: ' + e.message; el.style.display = 'block';
}
</script>
</body>
</html>
