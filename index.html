<!DOCTYPE html>

<head>

<title>Xem bản đồ nhà</title>
<style>

<body>

  <div>Chế độ: <span id="mode"></span> (<kbd>V</kbd> đổi) &nbsp; Đang xem: <span id="fl"></span></div>
  <div><kbd>1</kbd> tầng trệt &nbsp; <kbd>2</kbd> tầng lầu &nbsp; <kbd>3</kbd> cả hai &nbsp; <kbd>L</kbd> tên phòng</div>
  <div><b class="c" style="background:#ffd700"></b>Chìa khóa (kho) &nbsp; <b class="c" style="background:#33ff66"></b>Pin (4) &nbsp; <b class="c" style="background:#8b4513"></b>Cửa chính</div>
  <div><b class="c" style="background:#ff9933"></b>Thang giữa + chiếu nghỉ &nbsp; <b class="c" style="background:#3399ff"></b>2 thang vòng cung</div>

  <div id="help"></div>

</div>

<script>
const $ = id => document.getElementById(id);
try {
// =====================================================
//  BẢN ĐỒ NHÀ KIỂU DINH THỰ - đơn vị mét
//  x chạy sang phải (đông), z chạy xuống (nam). Nhà rộng W x dài D.
//  Cửa chính ở tường nam (z = D), giữa nhà (x = CX).
// =====================================================
const W = 80, D = 56, CX = W / 2;       // <<< CHỈNH KÍCH THƯỚC NHÀ Ở ĐÂY
const HEIGHT_MULT = 3;                  // <<< độ cao tầng lầu gấp mấy lần bình thường (3.2m)
const FLOOR2 = 3.2 * HEIGHT_MULT;       // độ cao mặt sàn tầng lầu (= 9.6m)
const WT = 0.3, WHG = FLOOR2 - 0.2, WHU = 4.0, DOOR_H = 3.0; // WHG: tường tầng trệt | WHU: tường tầng lầu

// CẦU THANG ĐÔI VÒNG CUNG
//  Thang giữa: rộng 8m, từ z = D-4 đi lên phía bắc (24 bậc, lên 4.8m) tới chiếu nghỉ rộng 16m x sâu 6m
//  2 thang cung: quay 1/4 vòng ra ngoài rồi chạy lên phía bắc (24 bậc, tới FLOOR2), đổ vào hành lang 2
const STEPS = 24, RISE = (FLOOR2 / 2) / STEPS, RUN = 0.4, RAIL_H = 1.0;
const FLIGHT_Z0 = D - 4, MID_W = 8;
const LAND_Z = FLIGHT_Z0 - STEPS * RUN - 3;                    // giữa chiếu nghỉ
const ARC_R = 8, ARC_W = 5, ARC_CZ = LAND_Z - ARC_R;           // tâm cung (z)
const LAND_H = FLOOR2 / 2;                                     // độ cao chiếu nghỉ
const HZ = ARC_CZ;                                             // mép bắc lỗ cầu thang = đầu hành lang tầng lầu
const HOLE_HALF = 8 + ARC_R + ARC_W / 2;                       // nửa bề rộng lỗ cầu thang (=18.5)

// Phòng: [tên, x1, z1, x2, z2, màu sàn]
const ROOMS_G = [
  ['HÀNH LANG 1',  0,  0, W,  8, 0x555555],
  ['PHÒNG KHÁCH',  0,  8, 16, D, 0x6b3a2a],
  ['SẢNH',        16,  8, W - 16, D, 0x3a5a3a],
  ['PHÒNG KHO',   W - 16, 8, W, D, 0x8a7a4a],
];
const ROOMS_U = [
  ['PHÒNG NGỦ',        0,  0, 26, 22, 0x2f4a6b],
  ['PHÒNG BẾP',       26,  0, 54, 22, 0x8a5a3a],       // <<< thay cho phòng làm việc
  ['THƯ VIỆN',        54,  0, W, 22, 0x6b5a3a],
  ['HÀNH LANG 2',      0, 22, W, HZ, 0x666666],
  ['PHÒNG TẮM',        0, HZ, 16, D, 0x4a6a6a],
  ['BAN CÔNG TÂY',    16, HZ, CX - HOLE_HALF, D, 0x777777],
  ['BAN CÔNG ĐÔNG',   CX + HOLE_HALF, HZ, W - 16, D, 0x777777],
  ['PHÒNG TRẺ EM',    W - 16, HZ, W, D, 0x6a4a5a],
];

// Tường: [hướng, từ, đến, vị trí cố định, [cửa [bắt đầu, kết thúc]]]  ('x' = chạy ngang, 'z' = chạy dọc; cửa xếp từ nhỏ đến lớn)
const WALLS_G = [
  ['x', 0, W, 0, []], ['x', 0, W, D, [[CX - 2, CX + 2]]],          // tường nam chừa cửa chính
  ['z', 0, D, 0, []], ['z', 0, D, W, []],
  ['x', 0, W, 8, [[6, 9], [CX - 8, CX + 8], [W - 9, W - 6]]],       // hành lang 1 -> khách | sảnh (cổng vòm) | kho
  ['z', 8, D, 16, [[30, 33]]], ['z', 8, D, W - 16, [[30, 33]]],    // khách <-> sảnh <-> kho
];
const WALLS_U = [
  ['x', 0, W, 0, []], ['x', 0, W, D, []],
  ['z', 0, D, 0, []], ['z', 0, D, W, []],
  ['x', 0, W, 22, [[11.5, 14.5], [38.5, 41.5], [65.5, 68.5]]],      // hành lang 2 -> ngủ | bếp | thư viện
  ['z', 0, 22, 26, []], ['z', 0, 22, 54, []],
  ['x', 0, 16, HZ, [[6.5, 9.5]]], ['x', W - 16, W, HZ, [[W - 9.5, W - 6.5]]], // hành lang 2 -> tắm | trẻ em
  ['z', HZ, D, 16, []], ['z', HZ, D, W - 16, []],
];

const KEY_POS  = [W - 8, 30];                                      // chìa khóa (phòng kho)
const BAT_POS  = [[8, 24, 0], [CX, 4, 0], [W - 8, 48, 0], [8, 12, FLOOR2]]; // [x, z, độ cao sàn]
const EXIT_POS = [CX, D];                                          // cửa chính
// =====================================================
//  HẾT PHẦN BẢN ĐỒ
// =====================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101010);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 800);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const amb = new THREE.AmbientLight(0xffffff, 0.85); scene.add(amb);
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(40, 120, 20); scene.add(sun);
